name: Beta checks and iOS build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      signed:
        description: Export a signed development IPA
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up Flutter and Java
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Analyze, test, and build Android
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub
          cd android
          ./gradlew :app:compileDebugAndroidTestKotlin

  build:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build Runner and Share Extension
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter build ios --release --no-codesign --no-pub
          extension=build/ios/iphoneos/Runner.app/PlugIns/ShareExtension.appex
          test -x "$extension/ShareExtension"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$extension/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")" = com.apple.share-services
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist")" = com.adesmith001.clipshare.ShareExtension
      - name: Run native iOS regression tests
        run: |
          flutter build ios --simulator --debug --no-pub
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator" \
            CODE_SIGNING_ALLOWED=NO

  sign:
    needs: [verify, build]
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check artifact visibility
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          if [[ "$PRIVATE_REPOSITORY" != true ]]; then
            echo "::error::A private repository is required for signed development IPA artifacts."
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Sign and export development IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_RUNNER_PROFILE: ${{ secrets.IOS_RUNNER_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: bash ios/export-development-ipa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ClipShare-development-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
