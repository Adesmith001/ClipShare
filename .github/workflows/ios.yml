name: iOS build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.*'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      signed:
        description: Export a signed development IPA
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: (github.event_name == 'push' && !github.event.repository.private) || (github.event_name == 'workflow_dispatch' && !inputs.signed)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build Runner and Share Extension
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter build ios --release --no-codesign --no-pub
          extension=build/ios/iphoneos/Runner.app/PlugIns/ShareExtension.appex
          test -x "$extension/ShareExtension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")" = com.apple.share-services
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist")" = com.adesmith001.clipshare.ShareExtension

  sign:
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check artifact visibility
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          if [[ "$PRIVATE_REPOSITORY" != true ]]; then
            echo "::error::A private repository is required for signed development IPA artifacts."
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Sign and export development IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_RUNNER_PROFILE: ${{ secrets.IOS_RUNNER_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: bash ios/export-development-ipa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ClipShare-development-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
