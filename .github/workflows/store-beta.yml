name: Store beta build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify both app variants
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
          flutter test --no-pub --dart-define=STORE_BETA=true test/store_beta_test.dart
      - name: Test native store-beta intake
        run: |
          flutter precache --ios
          flutter build ios --simulator --debug --config-only --no-codesign --no-pub --dart-define=STORE_BETA=true
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" CODE_SIGNING_ALLOWED=NO \
            CLIPSHARE_BUNDLE_ID=com.adesmith001.clipshare.beta \
            CLIPSHARE_APP_GROUP=group.com.adesmith001.clipshare.beta \
            'CLIPSHARE_DISPLAY_NAME=ClipShare Beta' 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) STORE_BETA'
      - name: Sign App Store beta
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.STORE_BETA_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.STORE_BETA_CERTIFICATE_PASSWORD }}
          IOS_RUNNER_PROFILE: ${{ secrets.STORE_BETA_RUNNER_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE: ${{ secrets.STORE_BETA_EXTENSION_PROFILE_BASE64 }}
          CLIPSHARE_DISTRIBUTION_MODE: store-beta
        run: bash ios/export-development-ipa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ClipShare-store-beta-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error
